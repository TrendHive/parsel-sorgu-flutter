<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3A4D"/>
      <stop offset="1" stop-color="#0E1C26"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- the registry's parcel: cyan, slightly off -->
  <polygon points="250,300 690,250 770,640 330,730" fill="#29B6F6" fill-opacity="0.18"
           stroke="#29B6F6" stroke-width="34" stroke-linejoin="round" stroke-dasharray="70 42"/>
  <!-- the family's real boundary: orange, solid -->
  <polygon points="300,350 740,330 760,720 360,770 280,560" fill="#FFA726" fill-opacity="0.30"
           stroke="#FFA726" stroke-width="40" stroke-linejoin="round"/>
  <!-- corner handles -->
  <g fill="#FFFFFF" stroke="#E65100" stroke-width="16">
    <circle cx="300" cy="350" r="40"/>
    <circle cx="740" cy="330" r="40"/>
    <circle cx="760" cy="720" r="40"/>
    <circle cx="360" cy="770" r="40"/>
    <circle cx="280" cy="560" r="40"/>
  </g>
</svg>
