# The analyzer is the first reviewer: anything it can be made to catch is not
# left to a person. `flutter analyze` must report zero issues — errors,
# warnings AND infos — before a change is done (CLAUDE.md, the gate).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Not warnings: a missing return or a forgotten await is a defect.
    missing_return: error
    unawaited_futures: error
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "lib/firebase_options.dart"
    - "lib/domain_ui/values/l10n/app_localizations*.dart"
    - build/**
    - android/**
    - ios/**
    - macos/**
    - windows/**
    - linux/**
    - web/**

linter:
  rules:
    # Layers are visible in every import path.
    always_use_package_imports: true
    # Types.
    always_declare_return_types: true
    avoid_dynamic_calls: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    type_annotate_public_apis: true
    # Widgets.
    use_key_in_widget_constructors: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    sized_box_for_whitespace: true
    use_colored_box: true
    # Async: a context used after an await belongs to a widget that may be gone.
    use_build_context_synchronously: true
    # Mistakes worth a rule: a debug print left behind, a doc comment naming a
    # type that moved, a `default:` that hides a new enum member, a stream
    # nobody cancels.
    avoid_print: true
    comment_references: true
    no_default_cases: true
    exhaustive_cases: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    unnecessary_statements: true
    test_types_in_equals: true
    avoid_positional_boolean_parameters: true
    prefer_void_to_null: true
    use_super_parameters: true
    # Readability.
    directives_ordering: true
    require_trailing_commas: true
    unnecessary_parenthesis: true
