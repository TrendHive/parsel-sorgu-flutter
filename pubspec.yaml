name: parcel_atlas
description: "Parcel Atlas — a family's shared map of land parcels: the official registry's boundaries beside the ones the family drew."
publish_to: "none"

version: 2.4.0+6

environment:
  sdk: ^3.14.0

# One package, layered in folders under lib/ — the structure Flutter's own
# architecture guide uses. The layer import rules are enforced by
# `dart run tool/check_structure.dart` (see CLAUDE.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^7.1.0
  dio: ^5.11.1
  either_dart: ^1.0.0
  equatable: ^3.0.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter_bloc: ^9.1.1
  flutter_map: ^8.3.2
  flutter_map_dragmarker: ^8.0.3
  geolocator: ^14.1.2
  get_it: ^9.3.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  logger: ^2.8.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: "assets/brand/icon-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/brand/icon-1024.png"
  web:
    generate: true
    image_path: "assets/brand/icon-1024.png"
  windows:
    generate: true
    image_path: "assets/brand/icon-1024.png"
